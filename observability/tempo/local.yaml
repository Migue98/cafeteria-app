stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 20
      queue_depth: 100

live_store:
  wal:
    path: /var/tempo/live-store/traces
  max_live_traces_bytes: 67108864
  max_block_duration: 30s

backend_worker:
  compaction:
    block_retention: 168h

backend_scheduler:
  local_work_path: /var/tempo/work
  provider:
    compaction:
      compaction:
        block_retention: 168h

usage_report:
  reporting_enabled: false
