apiVersion: 1

datasources:
  - name: Prometheus
    uid: cafeteria-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Prometheus
      prometheusVersion: 3.16.0
      manageAlerts: false
