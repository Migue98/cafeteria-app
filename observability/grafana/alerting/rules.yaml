apiVersion: 1
groups:
- orgId: 1
  name: cafeteria-local
  folder: Cafetería local
  interval: 10s
  rules:
  - uid: cafeteria-service-down
    title: Servicio inaccesible
    condition: B
    data:
    - refId: A
      datasourceUid: cafeteria-prometheus
      relativeTimeRange:
        from: 120
        to: 0
      model:
        datasource:
          type: prometheus
          uid: cafeteria-prometheus
        expr: 1 - up{job="cafeteria"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    noDataState: NoData
    execErrState: Error
    for: $ALERT_SERVICE_DOWN_FOR
    annotations:
      summary: '{{ $labels.service }} no responde al scrape'
      description: Prometheus no puede leer /metrics. Revisar el contenedor, los logs y /health.
      __dashboardUid__: cafeteria-application
      __panelId__: '1'
    labels:
      project: cafeteria
      severity: critical
    isPaused: false
  - uid: cafeteria-http-errors
    title: Errores HTTP frecuentes
    condition: B
    data:
    - refId: A
      datasourceUid: cafeteria-prometheus
      relativeTimeRange:
        from: 120
        to: 0
      model:
        datasource:
          type: prometheus
          uid: cafeteria-prometheus
        expr: (100 * (sum by(service) (increase(http_requests_total{job="cafeteria",route!~"/health|/metrics",status_code=~"5.."}[1m]))
          or on(service) (0 * sum by(service) (increase(http_requests_total{job="cafeteria",route!~"/health|/metrics"}[1m]))))
          / clamp_min(sum by(service) (increase(http_requests_total{job="cafeteria",route!~"/health|/metrics"}[1m])),
          1)) and on(service) (sum by(service) (increase(http_requests_total{job="cafeteria",route!~"/health|/metrics"}[1m]))
          >= 5)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: $ALERT_HTTP_ERRORS_FOR
    annotations:
      summary: '{{ $labels.service }} supera 10% de errores 5xx'
      description: Al menos cinco solicitudes de aplicación durante el último minuto y más de 10% de respuestas
        5xx. Revisar logs y trazas.
      __dashboardUid__: cafeteria-application
      __panelId__: '4'
    labels:
      project: cafeteria
      severity: warning
    isPaused: false
  - uid: cafeteria-points-pending
    title: Puntos pendientes
    condition: B
    data:
    - refId: A
      datasourceUid: cafeteria-prometheus
      relativeTimeRange:
        from: 120
        to: 0
      model:
        datasource:
          type: prometheus
          uid: cafeteria-prometheus
        expr: cafe_loyalty_pending_orders{job="cafeteria",service="svc-pedidos"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    noDataState: NoData
    execErrState: Error
    for: $ALERT_LOYALTY_PENDING_FOR
    annotations:
      summary: Hay pedidos con puntos pendientes de acreditar
      description: El backlog persiste durante el periodo configurado. Revisar svc-lealtad y el worker
        de reintentos; no volver a crear los pedidos.
      __dashboardUid__: cafeteria-business
      __panelId__: '4'
    labels:
      project: cafeteria
      severity: warning
    isPaused: false
