apiVersion: 1

contactPoints:
  - orgId: 1
    name: cafeteria-local-only
    receivers:
      - uid: cafeteria-local-only
        type: email
        settings:
          addresses: unused@example.invalid
  - orgId: 1
    name: cafeteria-telegram
    receivers:
      - uid: cafeteria-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          parse_mode: None
          disable_web_page_preview: true
          protect_content: false
          message: |
            {{ if eq .Status "firing" }}ALERTA{{ else }}RECUPERADO{{ end }} · Cafetería
            {{ range .Alerts }}
            {{ .Labels.alertname }} · {{ .Labels.severity }}
            Servicio: {{ .Labels.service }}
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ .GeneratorURL }}
            {{ end }}

muteTimes:
  - orgId: 1
    name: cafeteria-local-only
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"

policies:
  - orgId: 1
    receiver: cafeteria-local-only
    group_by: [alertname, service]
    group_wait: 10s
    group_interval: 30s
    repeat_interval: 1h
    routes:
      - receiver: cafeteria-telegram
        object_matchers:
          - [project, "=", cafeteria]
      - receiver: cafeteria-local-only
        mute_time_intervals: [cafeteria-local-only]
