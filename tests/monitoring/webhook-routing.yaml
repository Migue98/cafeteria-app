apiVersion: 1

contactPoints:
  - orgId: 1
    name: cafeteria-test-webhook
    receivers:
      - uid: cafeteria-test-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://alert-receiver:8080/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: cafeteria-test-webhook
    group_by: [alertname, service]
    group_wait: 1s
    group_interval: 5s
    repeat_interval: 1h
