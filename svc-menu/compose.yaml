services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: cafeteria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria -d cafeteria"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - menu-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-menu.sql:ro

  svc-menu:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      APP_VERSION: local
      DATABASE_URL: postgresql://cafeteria:cafeteria@postgres:5432/cafeteria
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  menu-postgres-data:
