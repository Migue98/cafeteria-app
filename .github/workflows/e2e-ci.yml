name: Integrated E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "svc-menu/**"
      - "svc-pedidos/**"
      - "svc-lealtad/**"
      - "tests/**"
      - "scripts/run_e2e.py"
      - "scripts/validate_contracts.py"
      - "compose.yaml"
      - "docs/openapi/**"
      - ".github/workflows/e2e-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "svc-menu/**"
      - "svc-pedidos/**"
      - "svc-lealtad/**"
      - "tests/**"
      - "scripts/run_e2e.py"
      - "scripts/validate_contracts.py"
      - "compose.yaml"
      - "docs/openapi/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

jobs:
  integrated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install --require-hashes -r tests/requirements.txt

      - name: Verify Docker Compose flow and concurrent requests
        run: python scripts/run_e2e.py
