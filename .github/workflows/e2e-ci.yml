name: Integrated E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "svc-menu/**"
      - "svc-pedidos/**"
      - "svc-lealtad/**"
      - "tests/**"
      - "ruff.toml"
      - "scripts/run_e2e.py"
      - "scripts/validate_contracts.py"
      - "compose.yaml"
      - "compose.public.yaml"
      - "docs/openapi/**"
      - ".github/workflows/e2e-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "svc-menu/**"
      - "svc-pedidos/**"
      - "svc-lealtad/**"
      - "tests/**"
      - "ruff.toml"
      - "scripts/run_e2e.py"
      - "scripts/validate_contracts.py"
      - "compose.yaml"
      - "compose.public.yaml"
      - "docs/openapi/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

jobs:
  integrated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install pip==26.3
          python -m pip install --require-hashes -r tests/requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Check browser tests and shared helpers
        run: |
          python -m ruff check tests/browser tests/conftest.py tests/support.py tests/e2e/conftest.py scripts/run_e2e.py
          python -m ruff format --check tests/browser tests/conftest.py tests/support.py tests/e2e/conftest.py scripts/run_e2e.py

      - name: Validate public Compose template
        env:
          SESSION_SECRET: ci-only-synthetic-session-secret-not-for-production
          POSTGRES_PASSWORD: ci-only-synthetic-database-password
          PUBLIC_ORIGIN: https://cafe.example
          ALLOWED_HOSTS: cafe.example,localhost,127.0.0.1
        run: docker compose -f compose.yaml -f compose.public.yaml config --quiet

      - name: Verify HTTP and Chromium flows on isolated Compose
        run: python scripts/run_e2e.py

      - name: Upload browser evidence and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
