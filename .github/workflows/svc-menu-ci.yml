name: svc-menu CI

on:
  pull_request:
    paths:
      - "svc-menu/**"
      - "docs/openapi/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/svc-menu-ci.yml"
  push:
    branches: [main]
    paths:
      - "svc-menu/**"
      - "docs/openapi/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/svc-menu-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svc-menu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            svc-menu/requirements.txt
            svc-menu/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate OpenAPI contracts
        working-directory: .
        run: python scripts/validate_contracts.py

      - name: Lint and check formatting
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

      - name: Build container image
        run: docker build -f Containerfile -t cafeteria-svc-menu:${{ github.sha }} .
