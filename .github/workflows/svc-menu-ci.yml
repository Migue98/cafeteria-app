name: svc-menu CI

on:
  pull_request:
    paths:
      - "tests/observability/**"
      - "svc-menu/**"
      - "docs/openapi/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/svc-menu-ci.yml"
  push:
    branches: [main]
    paths:
      - "tests/observability/**"
      - "svc-menu/**"
      - "docs/openapi/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/svc-menu-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: svc-menu

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: |
            svc-menu/requirements.txt
            svc-menu/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate OpenAPI contracts
        working-directory: .
        run: python scripts/validate_contracts.py

      - name: Lint and check formatting
        run: |
          ruff check app tests ../tests/observability
          ruff format --check app tests ../tests/observability

      - name: Run tests
        run: python -m pytest tests ../tests/observability -p no:cacheprovider

      - name: Build container image
        run: docker build -f Containerfile -t cafeteria-svc-menu:${{ github.sha }} .
