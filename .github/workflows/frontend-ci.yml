name: frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ruff.toml"
      - "tests/observability/**"
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "ruff.toml"
      - "tests/observability/**"
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            frontend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and check formatting
        run: |
          ruff check app tests ../tests/observability
          ruff format --check app tests ../tests/observability

      - name: Run tests
        run: python -m pytest -c pyproject.toml tests ../tests/observability -p no:cacheprovider

      - name: Build container image
        run: docker build -f Containerfile -t cafeteria-frontend:${{ github.sha }} .
