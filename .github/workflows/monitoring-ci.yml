name: Local monitoring

on:
  pull_request:
    paths:
      - "frontend/**"
      - "svc-*/**"
      - "compose.yaml"
      - "compose.monitoring.yaml"
      - "compose.telemetry.yaml"
      - "compose.telegram.yaml"
      - "observability/**"
      - "tests/monitoring/**"
      - "tests/conftest.py"
      - "tests/support.py"
      - "tests/requirements*"
      - "scripts/run_monitoring_e2e.py"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/monitoring-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "svc-*/**"
      - "compose.yaml"
      - "compose.monitoring.yaml"
      - "compose.telemetry.yaml"
      - "compose.telegram.yaml"
      - "observability/**"
      - "tests/monitoring/**"
      - "tests/conftest.py"
      - "tests/support.py"
      - "tests/requirements*"
      - "scripts/run_monitoring_e2e.py"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/monitoring-ci.yml"

permissions:
  contents: read

jobs:
  monitoring-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: metrics
            arguments: ""
          - mode: telemetry
            arguments: --telemetry --alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies and Chromium
        run: |
          python -m pip install pip==26.3
          python -m pip install --require-hashes -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check monitoring tests and runner
        run: |
          python -m ruff check tests/monitoring scripts/run_monitoring_e2e.py
          python -m ruff format --check tests/monitoring scripts/run_monitoring_e2e.py

      - name: Verify observability, persistence and browser access
        run: python scripts/run_monitoring_e2e.py ${{ matrix.arguments }}

      - name: Upload monitoring screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitoring-evidence-${{ matrix.mode }}
          path: test-results/monitoring/
          if-no-files-found: ignore
          retention-days: 7
