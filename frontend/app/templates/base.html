<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Menú y pedidos de Café Nube.">
    <title>{% block title %}Café Nube{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="csrf-token" content="{{ request.session.get('csrf_token', '') }}">
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"includeIndicatorStyles":false,"historyCacheSize":0}'>
    <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
    <script src="/static/vendor/response-targets-2.0.4.min.js" defer></script>
    <script src="/static/storefront.js" defer></script>
  </head>
  <body hx-headers='{"X-CSRF-Token":"{{ request.session.get("csrf_token", "") }}"}'>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Ir al menú de Café Nube">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M13 14h23v13a11 11 0 0 1-11 11h-1a11 11 0 0 1-11-11V14Z"/>
            <path d="M36 18h3a6 6 0 0 1 0 12h-3M18 9c0-3 3-3 3-6M27 9c0-3 3-3 3-6"/>
          </svg>
        </span>
        <span><strong>Café Nube</strong><small>Hecho cerca. Servido fácil.</small></span>
      </a>
      <nav aria-label="Navegación principal">
        <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Menú</a>
        <a href="/orders"{% if request.url.path == '/orders' %} aria-current="page"{% endif %}>Mis pedidos</a>
        <a class="nav-cart" href="/#cart-panel">Carrito{% include "_cart_count.html" %}</a>
      </nav>
    </header>

    <div id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </div>

    <footer class="site-footer">
      <p>Café Nube · Proyecto DevOps</p>
      <p>Menú, pedidos y lealtad conectados en tiempo real.</p>
    </footer>
  </body>
</html>
