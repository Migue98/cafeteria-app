x-tracing-environment: &tracing-environment
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-10}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-5000}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}

services:
  postgres:
    image: docker.io/library/postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafeteria}
      POSTGRES_USER: ${POSTGRES_USER:-cafeteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeteria}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cafeteria} -d ${POSTGRES_DB:-cafeteria}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cafeteria-postgres-data:/var/lib/postgresql/data
      - ./svc-menu/db/init.sql:/docker-entrypoint-initdb.d/001-menu.sql:ro
      - ./svc-pedidos/db/init.sql:/docker-entrypoint-initdb.d/002-orders.sql:ro
      - ./svc-lealtad/db/init.sql:/docker-entrypoint-initdb.d/003-loyalty.sql:ro
      - ./svc-menu/db/seed.sql:/docker-entrypoint-initdb.d/004-menu-seed.sql:ro
      - ./svc-lealtad/db/backfill-request-keys.sql:/opt/cafeteria/db/backfill-loyalty-request-keys.sql:ro

  svc-menu:
    build:
      context: ./svc-menu
      dockerfile: Containerfile
    environment:
      <<: *tracing-environment
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cafeteria}:${POSTGRES_PASSWORD:-cafeteria}@postgres:5432/${POSTGRES_DB:-cafeteria}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${MENU_PORT:-8001}:8001"

  svc-lealtad:
    build:
      context: ./svc-lealtad
      dockerfile: Containerfile
    environment:
      <<: *tracing-environment
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cafeteria}:${POSTGRES_PASSWORD:-cafeteria}@postgres:5432/${POSTGRES_DB:-cafeteria}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${LOYALTY_PORT:-8003}:8003"

  svc-pedidos:
    build:
      context: ./svc-pedidos
      dockerfile: Containerfile
    environment:
      <<: *tracing-environment
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cafeteria}:${POSTGRES_PASSWORD:-cafeteria}@postgres:5432/${POSTGRES_DB:-cafeteria}
      MENU_URL: http://svc-menu:8001
      LOYALTY_URL: http://svc-lealtad:8003
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
      LOYALTY_RETRY_ENABLED: ${LOYALTY_RETRY_ENABLED:-true}
      LOYALTY_RETRY_INTERVAL_SECONDS: ${LOYALTY_RETRY_INTERVAL_SECONDS:-900}
      LOYALTY_RETRY_BATCH_SIZE: ${LOYALTY_RETRY_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      svc-menu:
        condition: service_healthy
      svc-lealtad:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${ORDERS_PORT:-8002}:8002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    environment:
      <<: *tracing-environment
      APP_VERSION: ${APP_VERSION:-local}
      MENU_URL: http://svc-menu:8001
      ORDERS_URL: http://svc-pedidos:8002
      LOYALTY_URL: http://svc-lealtad:8003
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-change-me}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-86400}
    depends_on:
      svc-menu:
        condition: service_healthy
      svc-pedidos:
        condition: service_healthy
      svc-lealtad:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-8000}:8000"

volumes:
  cafeteria-postgres-data:
